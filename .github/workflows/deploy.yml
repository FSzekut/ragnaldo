# Entrega contínua do RAGnaldo.
#
# O índice vetorial é construído aqui, e não na imagem: os documentos-fonte são
# de terceiros e ficam fora do Git, então quem os guarda é o OCI Object Storage.
# É esse passo que satisfaz o requisito de usar ao menos um serviço OCI.
#
# A ordem importa. Os testes rodam antes de qualquer coisa cara, e a avaliação
# de recuperação roda depois do índice e antes do build: um índice que responde
# mal não vira imagem, e uma imagem que não existe não vai para produção.

name: deploy

on:
  push:
    branches: [main]
    # Mexer só no README não justifica reconstruir o índice e redeployar.
    paths-ignore:
      - "**.md"
      - "!docs/sources/**"
      - "notebooks/**"
  workflow_dispatch:

env:
  GCP_PROJECT: meu-claude-ui-2026
  GCP_REGION: southamerica-east1
  REPOSITORY: ragnaldo
  SERVICE: ragnaldo

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Exigida pelo Workload Identity Federation: o GitHub emite um token de
      # curta duração que o GCP troca por credenciais. Nenhuma chave de conta
      # de serviço precisa existir como secret.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências de ingestão
        run: |
          python -m pip install --upgrade pip
          # A CPU-only serve para gerar embeddings e evita baixar as bibliotecas
          # CUDA num runner que não tem GPU.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-ingest.txt

      - name: Testes e análise estática
        run: |
          python -m pytest -q
          ruff check .

      - name: Verificar dependências
        run: python -m pip check

      - name: Auditar vulnerabilidades
        # Informativo, não bloqueante: o torch vem do índice da PyTorch e não é
        # resolvível no PyPI, então o pip_audit sempre termina com erro por não
        # conseguir consultá-lo. Bloquear aqui reprovaria todo deploy pela mesma
        # razão irrelevante, e um gate que sempre falha deixa de ser lido.
        continue-on-error: true
        run: python -m pip_audit

      - name: Cache do modelo de embeddings
        # Sem isto, cada execução rebaixa os mesmos ~120 MB do HuggingFace. Os
        # runners saem por IPs compartilhados e as requisições anônimas batem no
        # rate limit (HTTP 429), derrubando o deploy por um motivo que não tem
        # nada a ver com o código. O modelo é imutável: cabe em cache indefinido.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-paraphrase-multilingual-MiniLM-L12-v2

      - name: Baixar documentos-fonte do OCI Object Storage
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_BUCKET: ${{ secrets.OCI_BUCKET }}
        run: python scripts/sync_oci.py download

      - name: Gerar índice vetorial
        env:
          # Opcional: requisições autenticadas ao Hub têm limite muito maior.
          # Vazio quando o segredo não existe, e aí vale o comportamento anônimo.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/build_index.py

      - name: Avaliar recuperação
        # O gate. Um índice que recusa perguntas legítimas ou responde as que
        # deveria recusar não chega a virar imagem.
        run: python scripts/eval_retrieval.py

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Autenticar no Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Construir e enviar a imagem
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${REPOSITORY}/${SERVICE}"
          # Duas tags: o SHA identifica exatamente o que está no ar e permite
          # voltar atrás; latest é conveniência para quem inspeciona à mão.
          docker build \
            --secret id=hf_token,env=HF_TOKEN \
            -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Publicar no Cloud Run
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${REPOSITORY}/${SERVICE}"
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --region "${GCP_REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 2 \
            --cpu-boost \
            --timeout 300 \
            --concurrency 8 \
            --max-instances 3 \
            --set-env-vars "LLM_PROVIDER=anthropic,LLM_MODEL=claude-sonnet-5" \
            --set-secrets "LLM_API_KEY=ragnaldo-llm-api-key:latest" \
            --quiet

      - name: Publicar a URL
        run: |
          URL=$(gcloud run services describe "${SERVICE}" \
            --region "${GCP_REGION}" --format 'value(status.url)')
          echo "### RAGnaldo no ar" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "${URL}" >> "${GITHUB_STEP_SUMMARY}"
